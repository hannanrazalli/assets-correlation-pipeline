version: 2

models:
  - name: stg_forex
    columns:
      - name: base_currency
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: ["USD"]

      - name: target_currency
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              arguments:
                values: ["MYR"]

  - name: stg_stocks
    columns:
      - name: close_price
        tests:
          - not_null:
              config:
                severity: error
          
      - name: ticker_symbol
        tests:
          - accepted_values:
              arguments:
                values: ["^GSPC", "^KLSE"]